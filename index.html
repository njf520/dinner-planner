<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Belly Up">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Belly Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf9f6;--bg2:#f2f0ea;--card:#fff;
  --text:#1a1814;--text2:#6b6760;--text3:#9e9b96;
  --accent:#c84b2f;--accent2:#e8753a;
  --border:rgba(26,24,20,0.1);--border2:rgba(26,24,20,0.18);
  --green:#2d7a4f;--green-bg:#eaf4ef;
  --radius:14px;--shadow:0 2px 12px rgba(0,0,0,0.06),0 1px 3px rgba(0,0,0,0.04)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#16140f;--bg2:#1e1c16;--card:#242118;
  --text:#f0ede6;--text2:#9e9b92;--text3:#6b6860;
  --accent:#e8753a;--accent2:#f0965a;
  --border:rgba(240,237,230,0.1);--border2:rgba(240,237,230,0.18);
  --green:#5fba87;--green-bg:#142a1e;
  --shadow:0 2px 12px rgba(0,0,0,0.3)
}}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px}
.app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto;position:relative}

/* ── Header ── */
.header{padding:14px 16px 0;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.app-title{font-family:'DM Serif Display',serif;font-size:21px;color:var(--text);letter-spacing:-0.3px;flex-shrink:0}
.app-title span{color:var(--accent)}
.search-bar{flex:1;position:relative}
.search-input{width:100%;padding:8px 12px 8px 32px;background:var(--bg2);border:1px solid var(--border);border-radius:22px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:0;display:none}
.nav-tabs{display:flex;gap:4px;background:var(--bg2);border-radius:10px;padding:3px;margin-bottom:0}
.nav-tab{flex:1;padding:7px 8px;border:none;background:transparent;color:var(--text2);font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;border-radius:8px;cursor:pointer;transition:all .2s;white-space:nowrap}
.nav-tab.active{background:var(--card);color:var(--text);box-shadow:var(--shadow)}

/* Filter bar */
.filter-bar{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0;border-bottom:1px solid var(--border)}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{padding:5px 12px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;transition:all .15s;flex-shrink:0}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-chip.sort-active{background:var(--bg2);color:var(--text);border-color:var(--border2)}

/* ── Main ── */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(80px + env(safe-area-inset-bottom, 16px))}

/* ── Recipe cards (rolodex view) ── */
.recipe-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:box-shadow .15s}
.recipe-card:hover{box-shadow:var(--shadow)}
.card-top{display:flex;gap:0;cursor:pointer}
.card-thumb{width:88px;height:88px;flex-shrink:0;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;position:relative}
.card-thumb img{width:100%;height:100%;object-fit:cover}
.card-thumb-btn{position:absolute;inset:0;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.card-thumb-btn:hover{background:rgba(0,0,0,0.22)}
.card-thumb-btn svg{opacity:0;color:#fff;transition:opacity .15s}
.card-thumb-btn:hover svg{opacity:1}
.card-body{flex:1;padding:11px 12px;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
.card-title{font-family:'DM Serif Display',serif;font-size:16px;color:var(--text);line-height:1.2;margin-bottom:5px}
.card-chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:5px}
.chip{padding:2px 7px;border-radius:20px;font-size:11px;font-weight:500}
.chip-tag{background:var(--bg2);color:var(--text2)}
.chip-time{background:rgba(200,75,47,0.08);color:var(--accent)}
.chip-diff{background:var(--bg2);color:var(--text2)}
.chip-diff.easy{background:#eaf4ef;color:var(--green)}
.chip-diff.medium{background:rgba(200,75,47,0.08);color:var(--accent)}
.chip-diff.hard{background:#fceaea;color:#a32d2d}
.card-meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--text3);flex-wrap:wrap}
.last-made-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.card-actions{display:flex;flex-direction:column;gap:6px;padding:8px 10px;justify-content:center;flex-shrink:0}
.plan-btn{padding:5px 10px;background:var(--accent);color:#fff;border:none;border-radius:7px;font-size:11px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap}
.plan-btn:hover{background:var(--accent2)}
.plan-btn.planned{background:var(--green-bg);color:var(--green);border:1px solid var(--green)}
.icon-btn{width:28px;height:28px;border:1px solid var(--border);border-radius:7px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:13px;transition:all .15s}
.icon-btn:hover{border-color:var(--border2);color:var(--text)}
.icon-btn.danger:hover{color:var(--accent);border-color:var(--accent)}

/* ── Detail panel (expanded) ── */
.card-detail{border-top:1px solid var(--border);background:var(--bg)}

/* Notes */
.notes-area{padding:10px 14px;border-bottom:1px solid var(--border)}
.notes-label{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:5px}
.notes-text{font-size:14px;color:var(--text2);line-height:1.5;white-space:pre-wrap}
.notes-edit{width:100%;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;resize:none;line-height:1.5;min-height:72px}
.notes-edit:focus{border-color:var(--accent)}
.notes-btn{margin-top:6px;padding:5px 12px;background:transparent;border:1px solid var(--border);border-radius:7px;font-size:12px;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif}

/* Multiplier */
.multiplier-row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border)}
.multiplier-label{font-size:12px;color:var(--text2);font-weight:500;flex:1}
.mult-btns{display:flex;gap:4px}
.mult-btn{padding:4px 10px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.mult-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Ingredients */
.ing-grid{padding:6px 14px 10px}
.ing-row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--border);font-size:14px}
.ing-row:last-child{border-bottom:none}
.ing-name{color:var(--text);flex:1}
.ing-note{color:var(--text3);font-size:12px}
.ing-amount{color:var(--text2);font-size:13px;text-align:right;margin-left:8px;white-space:nowrap}

/* Source images */
.source-images{display:flex;gap:8px;padding:8px 14px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--border)}
.source-images::-webkit-scrollbar{display:none}
.source-img-thumb{width:88px;height:88px;border-radius:8px;object-fit:cover;flex-shrink:0;cursor:pointer;border:1px solid var(--border);display:block}
.source-img-wrap{position:relative;flex-shrink:0}
.source-img-del{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,0.65);color:#fff;font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.source-img-del:hover{background:var(--accent)}
.source-link{display:block;font-size:13px;color:var(--accent);text-decoration:none;padding:8px 14px 12px;border-top:1px solid var(--border)}

/* Empty / results */
.empty-state{text-align:center;padding:40px 24px}
.empty-icon{font-size:44px;margin-bottom:12px}
.empty-title{font-family:'DM Serif Display',serif;font-size:19px;color:var(--text);margin-bottom:6px}
.empty-sub{font-size:14px;color:var(--text2);line-height:1.5}
.results-label{font-size:12px;color:var(--text3);margin-bottom:10px;padding:0 2px}

/* ── FAB ── */
.fab{position:absolute;bottom:22px;right:16px;z-index:100}
.fab-btn{width:52px;height:52px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(200,75,47,0.4);display:flex;align-items:center;justify-content:center;transition:all .2s}
.fab-btn:active{transform:scale(0.95)}

/* ── Sheet ── */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;background:var(--card);border-radius:20px 20px 0 0;z-index:201;transition:transform .3s cubic-bezier(0.34,1.3,0.64,1);padding:12px 14px 32px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet.open{transform:translateX(-50%) translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 10px}
.sheet-title{font-family:'DM Serif Display',serif;font-size:17px;margin-bottom:8px}
.form-group{margin-bottom:8px}
.form-label{font-size:11px;font-weight:500;color:var(--text2);margin-bottom:3px;display:block;letter-spacing:0.3px;text-transform:uppercase}
.form-input{width:100%;padding:8px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--accent)}
.form-input::placeholder{color:var(--text3)}
textarea.form-input{resize:none;height:64px;line-height:1.5}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.method-tabs{display:flex;gap:5px;margin-bottom:8px}
.method-tab{flex:1;padding:6px;border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--text2);font-size:12px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;text-align:center}
.method-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary{width:100%;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .15s;margin-top:6px}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.upload-area{border:2px dashed var(--border2);border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:14px}
.upload-area:hover{border-color:var(--accent);background:rgba(200,75,47,0.03)}
.upload-area input{display:none}
.upload-icon{font-size:28px;margin-bottom:6px}
.upload-text{font-size:13px;color:var(--text2)}
.upload-text strong{color:var(--accent)}
.preview-strip{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.preview-strip img{width:56px;height:56px;object-fit:cover;border-radius:7px;border:1px solid var(--border)}

/* difficulty selector */
.diff-btns{display:flex;gap:5px}
.diff-btn{flex:1;padding:5px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text2);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;text-align:center;transition:all .15s}
.diff-btn.active-easy{background:#eaf4ef;color:var(--green);border-color:var(--green)}
.diff-btn.active-medium{background:rgba(200,75,47,0.1);color:var(--accent);border-color:var(--accent)}
.diff-btn.active-hard{background:#fceaea;color:#a32d2d;border-color:#a32d2d}
.cat-btns{display:flex;gap:5px}
.cat-btn{flex:1;padding:5px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text2);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;text-align:center;transition:all .15s}
.cat-btn.active{background:rgba(200,75,47,0.1);color:var(--accent);border-color:var(--accent)}
.section-title{font-family:'DM Serif Display',serif;font-size:18px;margin:18px 0 10px;color:var(--text2)}
.section-title:first-child{margin-top:0}

/* tag input */
.tag-input-wrap{display:flex;flex-wrap:wrap;gap:4px;padding:5px 8px;background:var(--bg2);border:1px solid var(--border);border-radius:9px;cursor:text;min-height:34px;align-items:center}
.tag-input-wrap:focus-within{border-color:var(--accent)}
.tag-pill{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:2px 8px;font-size:12px;color:var(--text)}
.tag-pill button{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;line-height:1;padding:0}
.tag-raw-input{border:none;background:transparent;outline:none;font-size:14px;font-family:'DM Sans',sans-serif;color:var(--text);flex:1;min-width:80px}

/* Shopping */
.shop-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.shop-title-area h2{font-family:'DM Serif Display',serif;font-size:19px}
.shop-title-area p{font-size:12px;color:var(--text2);margin-top:2px}
.view-toggle{display:flex;gap:3px;background:var(--bg2);border-radius:8px;padding:3px}
.view-btn{padding:5px 9px;border:none;background:transparent;font-size:12px;font-weight:500;color:var(--text2);border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.view-btn.active{background:var(--card);color:var(--text)}
.shop-section{margin-bottom:18px}
.shop-section-title{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:7px}
.shop-item{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:5px;overflow:hidden}
.shop-item.have .shop-item-name{text-decoration:line-through;color:var(--text3)}
.shop-item.have .shop-item-amount,.shop-item.bought .shop-item-amount{color:var(--text3)}
.shop-item.bought{opacity:0.42}
.shop-have-zone{width:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:11px 0;cursor:pointer;border-right:1px solid var(--border);align-self:stretch;transition:background .15s}
.shop-have-zone:hover{background:var(--bg2)}
.have-icon{width:19px;height:19px;display:flex;align-items:center;justify-content:center;border-radius:4px;border:1.5px solid var(--border2)}
.shop-item.have .have-icon{background:rgba(200,75,47,0.1);border-color:var(--accent)}
.have-line{width:9px;height:1.5px;background:var(--text3);border-radius:1px}
.shop-item.have .have-line{background:var(--accent)}
.shop-item-body{flex:1;padding:10px 11px;cursor:pointer;min-width:0}
.shop-item-name{font-size:13px;color:var(--text)}
.shop-item-amount{font-size:11px;color:var(--text2);margin-top:1px}
.shop-item.have .shop-item-name{text-decoration:line-through;color:var(--text3)}
.shop-buy-zone{width:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:11px 0;cursor:pointer;border-left:1px solid var(--border);align-self:stretch;transition:background .15s}
.shop-buy-zone:hover{background:var(--bg2)}
.buy-check{width:21px;height:21px;border:1.5px solid var(--border2);border-radius:6px;display:flex;align-items:center;justify-content:center}
.shop-item.bought .buy-check{background:var(--green);border-color:var(--green)}
.check-mark{width:11px;height:11px;color:#fff;display:none}
.shop-item.bought .check-mark{display:block}
.shop-legend{display:flex;gap:14px;margin-bottom:12px;font-size:11px;color:var(--text3)}
.legend-item{display:flex;align-items:center;gap:4px}
.empty-plan{background:var(--bg2);border-radius:10px;padding:18px;text-align:center;color:var(--text2);font-size:14px}
.plan-count-bar{background:var(--green-bg);border:1px solid rgba(45,122,79,0.2);border-radius:9px;padding:9px 13px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--green)}
.clear-plan-btn{font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0;font-family:'DM Sans',sans-serif}
.done-shopping-btn{width:100%;padding:12px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:8px}

/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;overflow:hidden}
.lightbox.open{opacity:1;pointer-events:auto}
.lightbox-img-wrap{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;overflow:hidden}
.lightbox img{max-width:96vw;max-height:90vh;border-radius:8px;object-fit:contain;transform-origin:center center;transition:transform 0.05s linear;touch-action:none;user-select:none}
.lightbox-close{position:absolute;top:14px;right:16px;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:20px;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}

/* Spinner / toast */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:7px}
@keyframes spin{to{transform:rotate(360deg)}}
.status-msg{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:22px;font-size:13px;font-weight:500;z-index:400;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:92vw}
.status-msg.show{opacity:1}
.apikey-banner{background:rgba(200,75,47,0.08);border:1px solid rgba(200,75,47,0.2);border-radius:10px;padding:12px;margin-bottom:14px;font-size:13px;color:var(--text2);line-height:1.5}
.apikey-banner a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="app-title">Belly <span>Up</span></div>
      <div id="version-display" style="font-size:10px;color:var(--text3);flex-shrink:0;align-self:flex-end;padding-bottom:3px">v3.9</div>
      <div class="search-bar" id="search-bar">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="search-input" placeholder="Search recipes…" oninput="onSearch()" autocomplete="off">
        <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
      </div>
      <button onclick="openAddSheet()" aria-label="Add recipe" style="width:38px;height:38px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1">+</button>
    </div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showTab('recipes')">Recipes</button>
      <button class="nav-tab" onclick="showTab('shopping')">Shopping</button>
      <button class="nav-tab" onclick="showTab('settings')">Settings</button>
    </div>
  </div>
  <div class="filter-bar" id="filter-bar" style="display:none"></div>
  <div class="main" id="main-content"></div>
</div>

<!-- Add / Edit sheet -->
<div class="sheet-overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="add-sheet">

<script>
const VERSION='3.11';
const STORAGE_KEY='dinner_planner_v5';
let debugLog=[];
function dlog(msg, data){
  const entry={time:new Date().toLocaleTimeString(),msg,data:data?JSON.stringify(data).substring(0,500):''};
  debugLog.unshift(entry);
  if(debugLog.length>20) debugLog.pop();
  console.log('[PlanPlate]',msg,data||'');
}
const API_KEY_STORAGE='anthropic_api_key';

// GitHub repo used as permanent cloud backup for recipe data + photos (see
// "Cloud backup (GitHub)" section below). Restoring data never needs a token —
// only writing new backups does.
const GH_OWNER='njf520', GH_REPO='dinner-planner';
const GH_TOKEN_KEY='github_pat_token';
function getGhToken(){return localStorage.getItem(GH_TOKEN_KEY)||'';}
function saveGhToken(t){localStorage.setItem(GH_TOKEN_KEY,t.trim());}
// Set once the user has answered the first-run "add Nick's recipes?" prompt,
// so it's only ever shown once per browser.
const CLOUD_PROMPT_KEY='cloud_restore_choice';
// Tracks the exportedAt timestamp of the cloud backup as of our last
// successful sync/restore, so we can warn (non-blockingly) if another device
// has pushed since then — see syncBackupToCloud().
const LAST_SYNC_KEY='last_cloud_sync_at';

// Cloud-backup proxy (see worker.js) — lets users WITHOUT a GitHub token still
// get their recipes/photos backed up, into a namespaced folder of this repo,
// without ever handing out write access to the repo itself. Filled in once the
// worker is deployed; until then, users without a token simply aren't synced.
const WORKER_URL='https://belly-up-backup-proxy.njf520.workers.dev';
const ANON_ID_KEY='anon_backup_id';
const ANON_ID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function getAnonId(){
  let id=localStorage.getItem(ANON_ID_KEY);
  if(!id){ id=crypto.randomUUID(); localStorage.setItem(ANON_ID_KEY,id); }
  return id;
}
// True if this device can sync to the cloud at all — either Nick's own GitHub
// token (writes to the repo root) or, for everyone else, the backup proxy
// (writes to a per-device namespaced folder).
function cloudHasTransport(){ return !!(getGhToken()||WORKER_URL); }

let state={recipes:[],planned:[],checkedItems:{},haveItems:{}};
let currentTab='recipes';
let addMethod='url';
let pendingPhotos=[];
let expandedRecipe=null;
let recipeMultipliers={};
let editingRecipeId=null;
let pendingDiff=null;
let pendingCategory=null;
let pendingTags=[];
let searchQuery='';
let activeTagFilter=null;
let sortMode='default'; // 'default' | 'oldest-made' | 'never-made'

// ── Fraction math ──────────────────────────────────────────────────────────
const FRAC_MAP={'¼':0.25,'½':0.5,'¾':0.75,'⅓':0.333,'⅔':0.667,'⅛':0.125,'⅜':0.375,'⅝':0.625,'⅞':0.875};
function parseAmount(s){
  if(!s) return null;
  s=s.trim();
  for(const[f,v] of Object.entries(FRAC_MAP)) s=s.replace(new RegExp(f,'g'),' '+v+' ');
  const m=s.match(/^([\d\s.\/]+)/); if(!m) return null;
  const ns=m[1].trim();
  if(ns.includes('/')){const p=ns.split('/');return parseFloat(p[0])/parseFloat(p[1]);}
  return ns.split(/\s+/).filter(Boolean).reduce((a,b)=>a+parseFloat(b),0);
}
function toFrac(n){
  if(n===0) return '0';
  const w=Math.floor(n),fr=n-w;
  const fracs=[[0,''],[0.125,'⅛'],[0.25,'¼'],[0.333,'⅓'],[0.375,'⅜'],[0.5,'½'],[0.625,'⅝'],[0.667,'⅔'],[0.75,'¾'],[0.875,'⅞'],[1,'']];
  let best=[0,''],bd=99;
  for(const[v,s] of fracs){const d=Math.abs(fr-v);if(d<bd){bd=d;best=[v,s];}}
  const[bv,bs]=best;
  const W=bv>=0.99?w+1:w,F=bv>=0.99?'':bs;
  return W===0?(F||'0'):(F?`${W}${F}`:`${W}`);
}
// Scales the leading numeric portion of an amount string (e.g. "1½ cup" * 2 = "3 cup"),
// leaving the unit text untouched. Returns the original string if no number is found.
function scaleAmount(a,m){
  if(!a) return a;
  if(m===1) return a;
  let w=a.trim();
  // Replace unicode fractions with their values for parsing
  for(const[f,v] of Object.entries(FRAC_MAP)) w=w.replace(new RegExp(f,'g'),' '+v+' ');
  // Find where the numeric part ends
  let i=0;
  const nc=new Set([...'0123456789./ ','¼','½','¾','⅓','⅔','⅛','⅜','⅝','⅞']);
  // re-check original for numeric chars
  let orig=a.trim();
  let j=0;
  const ncOrig=new Set([...'0123456789./ ','¼','½','¾','⅓','⅔','⅛','⅜','⅝','⅞']);
  while(j<orig.length&&ncOrig.has(orig[j]))j++;
  const numPart=orig.slice(0,j).trim();
  const unitPart=orig.slice(j).trim();
  const val=parseAmount(numPart);
  if(val===null||isNaN(val)) return a;
  const scaled=val*m;
  return toFrac(scaled)+(unitPart?' '+unitPart:'');
}

// Build display amount from ingredient fields — always combines amount+unit correctly
function buildDisplayAmt(ing, mult){
  const amt=(ing.amount||'').toString().trim();
  const unit=(ing.unit||'').toString().trim();
  // If unit is already in the amount string, don't add it again
  const fullAmt = (unit && !amt.toLowerCase().includes(unit.toLowerCase()))
    ? (amt+' '+unit).trim()
    : amt;
  if(!fullAmt) return '';
  return mult && mult!==1 ? scaleAmount(fullAmt, mult)||fullAmt : fullAmt;
}

// ── State ──────────────────────────────────────────────────────────────────
function migrateRecipes(recipes){
  // Fix any recipe where unit was stored separately from amount
  return recipes.map(r=>{
    if(!r.ingredients) return r;
    const fixed = r.ingredients.map(ing=>{
      // If unit exists and amount doesn't already contain it, merge them
      if(ing.unit && ing.amount && !ing.amount.toLowerCase().includes(ing.unit.toLowerCase())){
        return {...ing, amount: ing.amount+' '+ing.unit, unit:''};
      }
      // If amount is just a bare number (including ranges like "1-2" or "1 to 2")
      // with no unit text, append unit
      if(ing.unit && ing.amount && /^[\d\s¼½¾⅓⅔⅛⅜⅝⅞\/\.\-–to]+$/i.test(ing.amount.trim())){
        return {...ing, amount: ing.amount.trim()+' '+ing.unit, unit:''};
      }
      return ing;
    });
    const category=r.category||(r.tags&&r.tags.includes('cocktail')?'drink':'food');
    return {...r, ingredients:fixed, category};
  });
}

// ── IndexedDB image storage ────────────────────────────────────────────────
// Source images are kept out of localStorage (which has a small quota and previously
// caused QuotaExceededError) and instead live in IndexedDB, keyed by recipe id.
// loadState() merges them back onto each recipe object in memory after loading.
const IDB_NAME='planplate_images';
const IDB_STORE='images';
const IDB_VERSION=1;
let idb=null;

function openIDB(){
  return new Promise((resolve,reject)=>{
    if(idb){resolve(idb);return;}
    const req=indexedDB.open(IDB_NAME,IDB_VERSION);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)){
        db.createObjectStore(IDB_STORE,{keyPath:'id'});
      }
    };
    req.onsuccess=e=>{idb=e.target.result;resolve(idb);};
    req.onerror=e=>{dlog('IDB open error: '+e.target.error);reject(e.target.error);};
  });
}

async function saveImages(recipeId, images){
  if(!images||!images.length) return true;
  try{
    const db=await openIDB();
    return new Promise((resolve)=>{
      const tx=db.transaction(IDB_STORE,'readwrite');
      const store=tx.objectStore(IDB_STORE);
      const req=store.put({id:String(recipeId),images});
      req.onsuccess=()=>{dlog('IDB saved images for '+recipeId);resolve(true);};
      req.onerror=e=>{dlog('IDB save error for '+recipeId+': '+e.target.error);resolve(false);};
    });
  }catch(e){
    dlog('saveImages IDB error: '+e.message);
    return false;
  }
}

async function loadImages(recipeId){
  try{
    const db=await openIDB();
    return new Promise((resolve)=>{
      const tx=db.transaction(IDB_STORE,'readonly');
      const store=tx.objectStore(IDB_STORE);
      const req=store.get(String(recipeId));
      req.onsuccess=e=>{resolve(e.target.result?.images||null);};
      req.onerror=()=>{resolve(null);};
    });
  }catch(e){
    dlog('loadImages IDB error: '+e.message);
    return null;
  }
}

async function deleteImages(recipeId){
  try{
    const db=await openIDB();
    return new Promise((resolve)=>{
      const tx=db.transaction(IDB_STORE,'readwrite');
      const store=tx.objectStore(IDB_STORE);
      store.delete(String(recipeId));
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>resolve();
    });
  }catch(e){}
}

async function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw) state=Object.assign({checkedItems:{},haveItems:{}},JSON.parse(raw));
    // migrate older versions
    for(const k of['dinner_planner_v4','dinner_planner_v3','dinner_planner_v2']){
      if(!state.recipes.length){try{const o=JSON.parse(localStorage.getItem(k)||'');if(o&&o.recipes)state.recipes=o.recipes;}catch(e){}}
    }
    // fix split amount/unit on all existing recipes
    if(state.recipes.length){
      state.recipes=migrateRecipes(state.recipes);
    }
    // load images from IndexedDB and attach to recipes in memory
    state.recipes=await Promise.all(state.recipes.map(async r=>{
      // Check IDB first
      const storedImgs=await loadImages(r.id);
      if(storedImgs&&storedImgs.length){
        return {...r, sourceImages:storedImgs};
      }
      // Fall back to images embedded in recipe data (old localStorage format)
      // migrate them to IDB
      if(r.sourceImages&&r.sourceImages.length){
        const ok=await saveImages(r.id, r.sourceImages);
        dlog('Migrated images for '+r.name+' to IDB: '+(ok?'OK':'FAILED'));
        return {...r, sourceImages:r.sourceImages};
      }
      return r;
    }));
    // Fresh install / wipe — if a cloud backup exists and the user hasn't been
    // asked yet, fetch it (without applying) so the welcome modal can offer it
    if(!state.recipes.length && !localStorage.getItem(CLOUD_PROMPT_KEY)){
      pendingCloudBackup=await fetchCloudBackup();
    }
    // Save core state (no images) to localStorage
    try{ saveState(); }catch(e){ dlog('saveState failed during loadState: '+e.message); }
  }catch(e){ dlog('loadState error: '+e.message); }
}

function saveState(force){
  // Safety net: if in-memory state has no (or far fewer) recipes than what's
  // already saved, refuse to overwrite — this is almost certainly an in-memory
  // bug (bad load, failed migration, etc.), not a deliberate wipe. The only
  // legitimate way to clear everything is confirmClearAll(), which passes
  // force=true.
  if(!force && state.recipes.length===0){
    const existingRaw=localStorage.getItem(STORAGE_KEY);
    if(existingRaw){
      let existingCount=0,parseFailed=false;
      try{
        const existing=JSON.parse(existingRaw);
        existingCount=(existing&&Array.isArray(existing.recipes))?existing.recipes.length:0;
      }catch(e){ parseFailed=true; }
      if(parseFailed||existingCount>1){
        dlog(`saveState BLOCKED: in-memory state has 0 recipes but storage has ${parseFailed?'unreadable':existingCount} — refusing to overwrite`);
        toast('⚠️ Save blocked to protect your recipes — please reload the app');
        return;
      }
    }
  }
  // Step 1: Save recipe data WITHOUT images — this must never fail silently
  try{
    const recipesWithoutImages=state.recipes.map(r=>({...r,sourceImages:undefined}));
    localStorage.setItem(STORAGE_KEY,JSON.stringify({...state,recipes:recipesWithoutImages}));
  }catch(e){
    if(e.name==='QuotaExceededError'){
      toast('⚠️ Critical: recipe data could not be saved — storage full. Export a backup NOW from Settings.');
    }
    return;
  }
  // Step 2: Save images one recipe at a time — if one fails, skip it, never touch others
  const failed=[];
  state.recipes.forEach(r=>{
    if(r.sourceImages&&r.sourceImages.length){
      const ok=saveImages(r.id,r.sourceImages);
      if(!ok) failed.push(r.name);
    }
  });
  if(failed.length){
    toast('⚠️ Images for "'+failed[0]+'"'+( failed.length>1?' +'+( failed.length-1)+' more':'')+' couldn\'t save — browser storage limit hit. Recipe data is safe. Export a backup from Settings.');
  }
  scheduleCloudSync();
}
function getApiKey(){return localStorage.getItem(API_KEY_STORAGE)||'';}
function saveApiKey(k){localStorage.setItem(API_KEY_STORAGE,k.trim());}

// ── Cloud backup (GitHub) ────────────────────────────────────────────────────
// Recipe data and photos are mirrored to the dinner-planner GitHub repo so they
// survive a browser/storage wipe:
//   images/{recipeId}-{index}.jpg  — one file per source photo
//   data/backup.json               — full recipe data (sourceImages excluded;
//                                     referenced via imageBackupUrls instead)
// Restoring (fetchCloudBackup/applyCloudBackup) reads via the public
// raw.githubusercontent.com CDN and needs no token. Writing (sync/upload) needs
// a GitHub token with Contents read/write on this repo, entered once in Settings.

async function ghRequest(path, opts={}){
  const token=getGhToken();
  return fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`,{
    ...opts,
    headers:{'Authorization':`Bearer ${token}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}
  });
}

async function ghGetSha(path){
  const res=await ghRequest(path);
  if(res.status===404) return null;
  if(!res.ok) throw new Error('GitHub GET '+path+' failed: '+res.status);
  return (await res.json()).sha;
}

// Creates or updates a file in the repo. Retries once if the cached sha is stale
// (another write happened in between).
async function ghPutFile(path, base64Content, message){
  for(let attempt=0;attempt<2;attempt++){
    const sha=await ghGetSha(path);
    const body={message, content:base64Content};
    if(sha) body.sha=sha;
    const res=await ghRequest(path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(res.ok) return res.json();
    if((res.status===409||res.status===422)&&attempt===0) continue;
    const e=await res.json().catch(()=>({}));
    throw new Error(e.message||('GitHub PUT '+path+' failed: '+res.status));
  }
}

// Fetches a public raw.githubusercontent.com image and converts it back to a data URL
// for storing in IndexedDB — used during restore, requires no auth.
async function fetchImageAsDataUrl(url){
  const res=await fetch(url);
  if(!res.ok) throw new Error('fetch image failed: '+res.status);
  const blob=await res.blob();
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

// Writes one recipe image to the cloud (direct to GitHub for Nick's device,
// or via the backup proxy for everyone else) and returns its public raw URL.
async function cloudPutImage(filename, dataUrl){
  const base64=dataUrl.split(',')[1];
  if(getGhToken()){
    await ghPutFile(`images/${filename}`, base64, `Add image ${filename}`);
    return `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main/images/${filename}`;
  }
  const id=getAnonId();
  const res=await fetch(`${WORKER_URL}/image/${id}/${filename}`,{method:'PUT',headers:{'Content-Type':'text/plain'},body:base64});
  if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.error||('Worker image upload failed: '+res.status)); }
  return `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main/images/users/${id}/${filename}`;
}

// Uploads any of a recipe's source images that aren't backed up yet, recording
// their raw.githubusercontent.com URLs in r.imageBackupUrls. Never throws —
// failures are logged and simply left for the next sync/migration pass.
async function uploadRecipeImages(r){
  if(!cloudHasTransport()||!r.sourceImages||!r.sourceImages.length) return false;
  r.imageBackupUrls=r.imageBackupUrls||[];
  let changed=false;
  for(let i=0;i<r.sourceImages.length;i++){
    if(r.imageBackupUrls[i]) continue;
    const filename=`${r.id}-${i}.jpg`;
    try{
      let dataUrl=r.sourceImages[i];
      let url;
      try{
        url=await cloudPutImage(filename, dataUrl);
      }catch(e){
        // Likely over the Contents API's 1MB limit — recompress smaller and retry once
        dlog('Image upload failed, retrying smaller: '+e.message);
        dataUrl=await compressImage(dataUrl, 900, 0.7);
        url=await cloudPutImage(filename, dataUrl);
      }
      r.imageBackupUrls[i]=url;
      changed=true;
    }catch(e){
      dlog('Image upload failed for '+(r.name||r.id)+' #'+i+': '+e.message);
    }
  }
  return changed;
}

// Pushes the full recipe dataset (minus image blobs, which live separately) to
// the cloud — data/backup.json for Nick's device, or a namespaced
// data/users/{id}/backup.json via the backup proxy for everyone else. No-ops
// if neither transport is configured.
async function syncBackupToCloud(){
  if(!cloudHasTransport()) return;
  // Safety net: never let an in-memory wipe (bug, bad load, etc.) propagate to
  // the cloud backup. If we have no recipes locally, mirror saveState()'s
  // refusal — leave the existing cloud backup alone.
  if(!state.recipes.length){
    dlog('syncBackupToCloud BLOCKED: state.recipes is empty — refusing to overwrite cloud backup');
    return;
  }
  try{
    // Multi-device safety check: if another device has pushed a newer backup
    // since our last known sync, warn the user (non-blocking — we still push
    // our local changes, since both sets of edits matter and this is meant to
    // be informational rather than a hard merge gate).
    const lastKnown=localStorage.getItem(LAST_SYNC_KEY);
    if(lastKnown){
      const remotePath=getGhToken()?undefined:`data/users/${getAnonId()}/backup.json`;
      const remote=await fetchCloudBackup(remotePath);
      if(remote&&remote.exportedAt&&remote.exportedAt!==lastKnown){
        dlog('Cloud backup changed since last sync (was '+lastKnown+', now '+remote.exportedAt+') — another device may have synced. Proceeding with this device\'s changes.');
        toast('⚠️ Recipes were also updated on another device — both changes are kept, but double-check for conflicts', 6000);
      }
    }
    const backup={
      recipes:state.recipes.map(r=>({...r,sourceImages:undefined})),
      planned:state.planned,checkedItems:state.checkedItems,haveItems:state.haveItems,
      exportedAt:new Date().toISOString()
    };
    const json=JSON.stringify(backup,null,2);
    if(getGhToken()){
      const base64=btoa(unescape(encodeURIComponent(json)));
      await ghPutFile('data/backup.json', base64, 'Sync recipe data');
    }else{
      const res=await fetch(`${WORKER_URL}/sync/${getAnonId()}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:json});
      if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.error||('Worker sync failed: '+res.status)); }
    }
    localStorage.setItem(LAST_SYNC_KEY, backup.exportedAt);
    dlog('Cloud backup synced ('+backup.recipes.length+' recipes)');
  }catch(e){
    dlog('Cloud backup sync failed: '+e.message);
  }
}

// Debounced trigger for syncBackupToCloud — frequent calls (e.g. shopping-list
// toggles) just keep resetting the timer rather than spamming commits.
let cloudSyncTimer=null;
function scheduleCloudSync(){
  if(!cloudHasTransport()) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer=setTimeout(()=>{cloudSyncTimer=null;syncBackupToCloud();}, 15000);
}
// Mobile PWAs don't reliably fire beforeunload, so flush a pending sync when backgrounded.
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'&&cloudSyncTimer){
    clearTimeout(cloudSyncTimer);cloudSyncTimer=null;
    syncBackupToCloud();
  }
});
// iOS Safari/PWAs fire pagehide (but not always visibilitychange) when the app
// is closed or swiped away — flush there too as a second safety net.
window.addEventListener('pagehide',()=>{
  if(cloudSyncTimer){
    clearTimeout(cloudSyncTimer);cloudSyncTimer=null;
    syncBackupToCloud();
  }
});

// Holds a fetched-but-not-yet-applied cloud backup, pending the user's choice
// in the welcome modal (see acceptCloudRestore/declineCloudRestore).
let pendingCloudBackup=null;

// Fetches a backup.json from GitHub's public CDN — no token needed. Defaults
// to Nick's own data/backup.json; pass path for a namespaced
// data/users/{id}/backup.json (anon restore-from-ID). Returns the parsed
// backup, or null if there's no backup yet / fetch failed.
async function fetchCloudBackup(path){
  try{
    const res=await fetch(`https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main/${path||'data/backup.json'}?cb=${Date.now()}`,{cache:'no-store'});
    if(!res.ok) return null;
    const backup=await res.json();
    if(!backup.recipes||!backup.recipes.length) return null;
    return backup;
  }catch(e){ dlog('Cloud backup fetch failed: '+e.message); return null; }
}

// Applies a fetched backup to local state, pulling each recipe's photos back
// from GitHub via the public raw CDN.
//
// If the local recipe book is empty (fresh install / first-run welcome modal),
// this is a full restore — the backup becomes the local state outright.
// Otherwise (e.g. "Restore from another device" on a device that already has
// recipes), it MERGES: any backup recipe not already present locally (by id or
// name) is added, and existing local recipes/marks are never removed or
// overwritten — avoids silently wiping recipes the user already has.
async function applyCloudBackup(backup){
  const freshStart=state.recipes.length===0;
  let added;
  if(freshStart){
    state.recipes=backup.recipes||[];
    state.planned=backup.planned||[];
    state.checkedItems=backup.checkedItems||{};
    state.haveItems=backup.haveItems||{};
    added=state.recipes;
    dlog('Restoring '+state.recipes.length+' recipes from cloud backup');
  }else{
    const existingIds=new Set(state.recipes.map(r=>r.id));
    const existingNames=new Set(state.recipes.map(r=>(r.name||'').toLowerCase()));
    added=(backup.recipes||[]).filter(r=>!existingIds.has(r.id)&&!existingNames.has((r.name||'').toLowerCase()));
    state.recipes=[...state.recipes, ...added];
    state.planned=[...new Set([...state.planned, ...(backup.planned||[])])];
    state.checkedItems={...(backup.checkedItems||{}), ...state.checkedItems};
    state.haveItems={...(backup.haveItems||{}), ...state.haveItems};
    dlog('Merging cloud backup: '+added.length+' new of '+(backup.recipes||[]).length+' recipes');
  }
  for(const r of added){
    if(r.imageBackupUrls&&r.imageBackupUrls.length){
      const dataUrls=[];
      for(const url of r.imageBackupUrls){
        try{ dataUrls.push(await fetchImageAsDataUrl(url)); }catch(e){ dlog('Restore image fetch failed: '+e.message); }
      }
      if(dataUrls.length){ r.sourceImages=dataUrls; await saveImages(r.id, dataUrls); }
    }
  }
  saveState();
  if(backup.exportedAt) localStorage.setItem(LAST_SYNC_KEY, backup.exportedAt);
  if(freshStart){
    toast(`Restored ${state.recipes.length} recipes from cloud backup ✓`, 5000);
  }else if(added.length){
    toast(`Added ${added.length} new recipe(s) from backup ✓`, 5000);
  }else{
    toast(`No new recipes — you already have everything from that backup`, 5000);
  }
}

// Progress indicator for the one-time "back up all photos" migration, read by renderSettings().
let ghBackupStatus=null;

// One-time migration: uploads every existing recipe photo that isn't backed up yet.
async function backupAllImagesToGitHub(){
  if(!getGhToken()){toast('Add a GitHub token first.');return;}
  const todo=state.recipes.filter(r=>r.sourceImages&&r.sourceImages.length&&
    (!r.imageBackupUrls||r.imageBackupUrls.length<r.sourceImages.length||r.imageBackupUrls.some(u=>!u)));
  if(!todo.length){toast('All photos are already backed up.');return;}
  ghBackupStatus={done:0,total:todo.length,label:todo[0].name||'recipe'};
  render();
  for(const r of todo){
    ghBackupStatus.label=r.name||'recipe';
    render();
    await uploadRecipeImages(r);
    ghBackupStatus.done++;
    saveState();
    await new Promise(res=>setTimeout(res,1200));
  }
  ghBackupStatus=null;
  clearTimeout(cloudSyncTimer);cloudSyncTimer=null;
  await syncBackupToCloud();
  render();
  toast('Backup complete!');
}

// "Restore from another device" for anon (no-token) users: fetches their
// namespaced backup by ID and applies it, same as the welcome-modal restore.
async function restoreFromAnonId(){
  const input=document.getElementById('anon-restore-input');
  const id=input.value.trim().toLowerCase();
  if(!ANON_ID_RE.test(id)){toast('That doesn\'t look like a valid backup ID.');return;}
  if(state.recipes.length&&!confirm(`Add any recipes from backup ${id} that you don't already have? Your existing recipes won't be removed or changed.`)) return;
  const backup=await fetchCloudBackup(`data/users/${id}/backup.json`);
  if(!backup){toast('No backup found for that ID.');return;}
  await applyCloudBackup(backup);
  render();
}

// Summarizes how much of the recipe/photo data is mirrored to GitHub, for display in Settings.
function getGhSyncStatus(){
  const withImages=state.recipes.filter(r=>r.sourceImages&&r.sourceImages.length);

  withImages.forEach(r=>{
    totalImgs+=r.sourceImages.length;
    backedImgs+=(r.imageBackupUrls||[]).filter(Boolean).length;
  });
  return{recipesWithImages:withImages.length,totalImgs,backedImgs};
}

function getFilteredRecipes(){
  let list=[...state.recipes];

    const q=searchQuery.toLowerCase();
    list=list.filter(r=>(r.name||'').toLowerCase().includes(q)||(r.tags||[]).some(t=>t.toLowerCase().includes(q))||(r.ingredients||[]).some(ing=>(ing.name||'').toLowerCase().includes(q)));
  }

  if(sortMode==='default') list.sort((a,b)=>(b.lastOpened||0)-(a.lastOpened||0));
  else if(sortMode==='oldest-made') list.sort((a,b)=>(a.lastMade||0)-(b.lastMade||0));
  else if(sortMode==='never-made') list=list.filter(r=>!r.lastMade);
  return list;
}

// Flat list of every source image across the currently visible recipes, in
// the same order they're rendered (Food section, then Drinks), so the
// lightbox can swipe across recipe boundaries.
function getGlobalImageList(){
  const list=getFilteredRecipes();
  const ordered=[...list.filter(r=>r.category!=='drink'), ...list.filter(r=>r.category==='drink')];
  const out=[];
  for(const r of ordered){
    (r.sourceImages||[]).forEach((src,idx)=>out.push({recipeId:r.id, idx, src}));
  }
  return out;
}

// Opens the lightbox at a given recipe's image, but with the full
// cross-recipe image list so swiping continues into neighboring recipes.
function openLightboxFromRecipe(recipeId, imgIndex){
  const all=getGlobalImageList();
  let pos=all.findIndex(x=>x.recipeId===recipeId&&x.idx===imgIndex);
  if(pos<0) pos=0;
  openLightbox(all.map(x=>x.src), pos);
}

function getAllTags(){

// ── Lightbox ───────────────────────────────────────────────────────────────
let lightboxImages=[];
let lightboxIndex=0;
// Tracks whether openLightbox() pushed a history entry that closeLightbox()
// still needs to pop (vs. having already been popped via the back button).
let lightboxHistoryActive=false;
// Pinch/zoom state
let lbScale=1, lbMinScale=1, lbMaxScale=4;
let lbOffsetX=0, lbOffsetY=0;
let lbLastTouchDist=0;
let lbTouchStartX=0, lbTouchStartY=0;
let lbDragStartX=0, lbDragStartY=0;
let lbIsPinching=false;

function openLightbox(images, startIndex){
  lightboxImages = images||[];
  lightboxIndex = startIndex||0;
  if(lightboxIndex<0||lightboxIndex>=lightboxImages.length) lightboxIndex=0;
  lbScale=1; lbOffsetX=0; lbOffsetY=0;
  updateLightbox();
  document.getElementById('lightbox').classList.add('open');
  setupLightboxTouch();
  // Push a history entry so the device/browser back button closes the
  // lightbox instead of navigating away from (or closing) the app.
  history.pushState({lightbox:true}, '');
  lightboxHistoryActive=true;
}

function updateLightbox(){
  const img=document.getElementById('lightbox-img');
  img.src=lightboxImages[lightboxIndex];
  lbScale=1; lbOffsetX=0; lbOffsetY=0;
  applyLbTransform();
  const multi=lightboxImages.length>1;
  const prev=document.getElementById('lightbox-prev');
  const next=document.getElementById('lightbox-next');
  const counter=document.getElementById('lightbox-counter');
  prev.style.display=multi?'flex':'none';
  next.style.display=multi?'flex':'none';
  counter.style.display=multi?'block':'none';
  if(multi) counter.textContent=`${lightboxIndex+1} / ${lightboxImages.length}`;
}

function applyLbTransform(){
  const img=document.getElementById('lightbox-img');
  img.style.transform=`translate(${lbOffsetX}px,${lbOffsetY}px) scale(${lbScale})`;
}

function setupLightboxTouch(){
  const wrap=document.getElementById('lightbox-img-wrap');
  wrap.ontouchstart=function(e){
    if(e.touches.length===2){
      lbIsPinching=true;
      lbLastTouchDist=getTouchDist(e.touches);
    } else if(e.touches.length===1){
      lbIsPinching=false;
      lbTouchStartX=e.touches[0].clientX;
      lbTouchStartY=e.touches[0].clientY;
      lbDragStartX=lbOffsetX;
      lbDragStartY=lbOffsetY;
    }
  };
  wrap.ontouchmove=function(e){
    e.preventDefault();
    if(e.touches.length===2){
      lbIsPinching=true;
      const dist=getTouchDist(e.touches);
      const delta=dist/lbLastTouchDist;
      lbScale=Math.min(lbMaxScale, Math.max(lbMinScale, lbScale*delta));
      lbLastTouchDist=dist;
      applyLbTransform();
    } else if(e.touches.length===1&&lbScale>1){
      // pan when zoomed in
      lbOffsetX=lbDragStartX+(e.touches[0].clientX-lbTouchStartX);
      lbOffsetY=lbDragStartY+(e.touches[0].clientY-lbTouchStartY);
      applyLbTransform();
    }
  };
  // Swipe left/right to navigate, double-tap to zoom.
  let lbLastTap=0;
  wrap.ontouchend=function(e){
    const now=Date.now();
    if(!lbIsPinching&&e.changedTouches.length===1&&lbScale===1){
      const dx=e.changedTouches[0].clientX-lbTouchStartX;
      const dy=Math.abs(e.changedTouches[0].clientY-lbTouchStartY);
      if(Math.abs(dx)>50&&dy<40){ lightboxNav(dx<0?1:-1); return; }
      if(now-lbLastTap<300){ lbScale=2.5; applyLbTransform(); lbLastTap=0; return; }
      lbLastTap=now;
    } else if(lbIsPinching&&e.touches.length<2){
      lbIsPinching=false;
      if(lbScale<=1.05){ lbScale=1; lbOffsetX=0; lbOffsetY=0; applyLbTransform(); }
    }
  };
  // close on tap when not zoomed
  const lb=document.getElementById('lightbox');
  lb.onclick=function(e){
    if(lbScale===1&&e.target===lb) closeLightbox();
  };
}

function getTouchDist(touches){
  const dx=touches[0].clientX-touches[1].clientX;
  const dy=touches[0].clientY-touches[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}

function lightboxNav(dir){
  lightboxIndex=(lightboxIndex+dir+lightboxImages.length)%lightboxImages.length;
  updateLightbox();
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  lbScale=1; lbOffsetX=0; lbOffsetY=0;
  // If we pushed a history entry to open this, pop it now so back/forward
  // state stays in sync (the popstate listener below no-ops since the
  // lightbox is already closed).
  if(lightboxHistoryActive){
    lightboxHistoryActive=false;
    history.back();
  }
}
// Closes the lightbox on back-button/gesture instead of leaving the app.
window.addEventListener('popstate',()=>{
  if(document.getElementById('lightbox').classList.contains('open')){
    lightboxHistoryActive=false;
    document.getElementById('lightbox').classList.remove('open');
    lbScale=1; lbOffsetX=0; lbOffsetY=0;
  }
});

// ── Toast ──────────────────────────────────────────────────────────────────
function toast(msg,dur=0){
  // Auto-duration: short for confirmations, longer for warnings, even longer for errors
  if(!dur){
    if(msg.includes('⚠️')||msg.includes('Critical')) dur=8000;
    else if(msg.length>60) dur=4500;
    else dur=2400;
  }
  const el=document.getElementById('status-msg');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._toastTimer);
  el._toastTimer=setTimeout(()=>el.classList.remove('show'),dur);
}

// difficulty

// Downscales/recompresses an image to keep IndexedDB storage reasonable
// (source photos default to 1200px max dimension, 80% JPEG quality).
function compressImage(dataUrl, maxDim, quality){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=function(){
      const canvas=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}else{w=Math.round(w*maxDim/h);h=maxDim;}}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      resolve(canvas.toDataURL('image/jpeg',quality));
    };
    img.src=dataUrl;
  });
}

function getStorageUsedKB(){
  let total=0;
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    total+=localStorage.getItem(key).length;
  }
  return Math.round(total/1024);
}

function handleImageFiles(files){
  if(!files.length)return;
  const prev=document.getElementById('photo-previews');
  Array.from(files).forEach(file=>{
    const reader=new FileReader();
    reader.onload=async function(ev){
      // Compress to reasonable size for display: 1200px max, 80% quality
      const dataUrl=await compressImage(ev.target.result, 1200, 0.80);
      const sizeKB=Math.round(dataUrl.length/1024);
      dlog('Compressed image to '+sizeKB+'KB');
      pendingPhotos.push({dataUrl,mimeType:'image/jpeg'});
      const thumb=document.createElement('img');thumb.src=dataUrl;prev.appendChild(thumb);
      document.getElementById('upload-text-label').textContent=`${pendingPhotos.length} image${pendingPhotos.length>1?'s':''} ready (${sizeKB}KB)`;
    };
    reader.readAsDataURL(file);
  });
}

const SYS=`You are a recipe and cocktail parser. Return ONLY valid JSON, no markdown.
Shape: {"name":"str","servings":null,"source":"str or null","emoji":"food or drink emoji","time":"e.g. 45 min or null","difficulty":"easy|medium|hard or null","category":"food|drink","tags":["tag1"],"ingredients":[{"name":"str","amount":"str","unit":"str","notes":"str or null"}]}

CRITICAL AMOUNT RULES:
- ALWAYS put the FULL amount including unit in the "amount" field: "1½ oz", "¾ cup", "2 tbsp", "3 dashes"
- Put the unit word ALSO in the "unit" field separately: "oz", "cup", "tbsp"
- NEVER put just a bare number in amount with the unit only in unit field
- Examples: amount="1½ oz" unit="oz" ✓   amount="1½" unit="oz" ✗

FOOD RECIPE UNITS — always American:
- NEVER grams/ml/liters/kg. Convert: g→oz, kg→lb, ml→fl oz or cups, L→cups
- Best cooking unit: spices=tsp, butter=tbsp, medium liquid=cup, cheese/meat=oz or lb, flour/sugar=cup
- Fractions: ¼ ⅓ ½ ¾

COCKTAIL RECIPE RULES:
- Set category to "drink"; for food recipes set category to "food"
- Use oz for all spirits and liqueurs
- Convert ml to oz: 15ml=½ oz, 20ml=⅔ oz, 22.5ml=¾ oz, 30ml=1 oz, 45ml=1½ oz, 60ml=2 oz
- Keep dashes, drops, barspoons as-is
- Set servings to 1 for cocktails
- Store glass type and garnish as ingredients with amount="" unit="glass" or "garnish"
- Use emoji 🍸 or 🥃 for cocktails
- Tags should include "cocktail" plus spirit type (e.g. "mezcal", "gin", "whiskey")

CRITICAL: Capture EVERY ingredient listed. Do not skip, summarize, or omit any ingredient no matter how minor — including garnishes, optional ingredients, and small amounts like a pinch of salt or a drizzle of honey.

CRITICAL: When a recipe says "X or Y or Z" meaning the cook should pick one (e.g. "basil or parsley or mint", "chicken or vegetable stock", "butter or olive oil"), do NOT create separate line items for each. Instead create ONE ingredient with the most generic name (e.g. "fresh herbs", "stock", "fat") and put the options in the notes field (e.g. "basil, parsley, or mint"). The amount should reflect a single choice, not multiples.

URL FALLBACK: If given a URL with little/no page text, use your knowledge of that URL/recipe to fill in the details. Difford's Guide, Epicurious, Serious Eats, NYT Cooking are well known — reconstruct from training data if needed.

For tags, suggest 1-4 short lowercase descriptors.
Return ONLY the JSON.`;

// Calls the Anthropic API for recipe parsing. If the user has saved their own
// API key (in Settings), calls Anthropic directly from the browser using it.
// Otherwise, routes through the Worker proxy (see worker.js /ai/:userId),
// which uses a shared key and enforces a per-user daily rate limit. 45s
// timeout guards against hung requests on flaky mobile connections.
async function apiPost(body){
  const key=getApiKey();
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),45000); // 45 second timeout
  try{
    let res;
    if(key){
      res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:3000,...body}),
        signal:controller.signal
      });
    }else{
      if(!WORKER_URL)throw new Error('NO_API_KEY');
      res=await fetch(`${WORKER_URL}/ai/${getAnonId()}`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body),
        signal:controller.signal
      });
    }
    clearTimeout(timeout);
    if(!res.ok){const e=await res.json().catch(()=>{});throw new Error(e?.error?.message||e?.error||`API error ${res.status}`);}
    const data=await res.json();
    return data.content.find(b=>b.type==='text')?.text||'';
  }catch(e){
    clearTimeout(timeout);
    if(e.name==='AbortError') throw new Error('Request timed out — please try again');
    throw e;
  }
}
function parseJSON(raw){
  const clean=raw.replace(/```json|```/g,'').trim();
  // Find the first { and last } to extract just the JSON object
  const start=clean.indexOf('{');
  const end=clean.lastIndexOf('}');
  if(start===-1||end===-1) throw new Error('No JSON object found in response');
  return JSON.parse(clean.slice(start,end+1));
}
function showError(msg){
  document.getElementById('add-error').textContent=msg;
  document.getElementById('add-error').style.display='block';
  const btn=document.getElementById('add-btn');btn.textContent=editingRecipeId?'Save changes':'Add recipe';btn.disabled=false;
}

function collectMeta(parsed){
  // override AI suggestions with user-provided values
  const servings=parseInt(document.getElementById('meta-servings').value)||parsed.servings||null;
  const time=document.getElementById('meta-time').value.trim()||parsed.time||null;
  const notes=document.getElementById('meta-notes').value.trim()||null;
  const difficulty=pendingDiff||parsed.difficulty||null;
  // merge AI tags with user tags
  const aiTags=(parsed.tags||[]).map(t=>t.toLowerCase().trim());
  const allTags=[...new Set([...pendingTags,...aiTags])];
  const category=pendingCategory||parsed.category||(allTags.includes('cocktail')?'drink':'food');
  return{servings,time,notes,difficulty,tags:allTags,category};
}

async function submitRecipe(){
  const btn=document.getElementById('add-btn');
  document.getElementById('add-error').style.display='none';
  const key=getApiKey();

  if(editingRecipeId){
    // Save edits directly (no AI re-parse)
    const r=state.recipes.find(x=>x.id===editingRecipeId);if(!r)return;
    const ingText=document.getElementById('manual-ingredients').value.trim();
    const ingredients=ingText?ingText.split('\n').filter(Boolean).map(l=>({name:l,amount:'',unit:'',notes:null})):r.ingredients;
    const servings=parseInt(document.getElementById('meta-servings').value)||r.servings||null;
    const source=document.getElementById('manual-source').value.trim()||r.source||null;
    Object.assign(r,{
      name:document.getElementById('manual-name').value.trim()||r.name,
      source,servings,
      time:document.getElementById('meta-time').value.trim()||r.time||null,
      notes:document.getElementById('meta-notes').value.trim()||null,
      difficulty:pendingDiff||r.difficulty||null,
      category:pendingCategory||r.category||'food',
      tags:[...new Set([...pendingTags,...(r.tags||[])])],
      ingredients
    });
    saveState();closeSheet();toast('Recipe updated!');render();return;
  }

  if(addMethod==='manual'){
    const name=document.getElementById('manual-name').value.trim();
    const ingText=document.getElementById('manual-ingredients').value.trim();
    const source=document.getElementById('manual-source').value.trim();
    if(!name){showError('Please enter a recipe name.');return;}
    if(!ingText){showError('Please enter at least one ingredient.');return;}
    if(key){
      btn.innerHTML='<span class="spinner"></span>Parsing…';btn.disabled=true;
      try{
        const raw=await apiPost({system:SYS,messages:[{role:'user',content:`Name:${name}\nSource:${source}\nIngredients:\n${ingText}`}]});
        const parsed=parseJSON(raw);
        const meta=collectMeta(parsed);
        persistRecipe({...parsed,...meta,source:source||parsed.source||null,id:Date.now()+Math.floor(Math.random()*1000)});
        closeSheet();toast('Recipe added!');
      }catch(e){
        const ingredients=ingText.split('\n').filter(Boolean).map(l=>({name:l,amount:'',unit:'',notes:null}));
        const meta=collectMeta({});
        persistRecipe({name,emoji:'🍽️',...meta,source:source||null,ingredients,id:Date.now()+Math.floor(Math.random()*1000)});
        closeSheet();toast('Added (without AI parsing)');
      }
    }else{
      const ingredients=ingText.split('\n').filter(Boolean).map(l=>({name:l,amount:'',unit:'',notes:null}));
      const meta=collectMeta({});
      persistRecipe({name,emoji:'🍽️',...meta,source:source||null,ingredients,id:Date.now()});
      closeSheet();toast('Recipe added!');
    }
    return;
  }

  if(!key&&!WORKER_URL){showError('No API key found. Go to Settings tab, paste your key, and tap Save key first.');return;}

  if(addMethod==='url'){
    const url=document.getElementById('url-input').value.trim();
    if(!url){showError('Please enter a URL.');return;}
    btn.innerHTML='<span class="spinner"></span>Fetching…';btn.disabled=true;
    try{
      // Browsers can't fetch arbitrary cross-origin pages directly (CORS), so we try a
      // few public CORS proxies in sequence until one returns usable HTML.
      let text='';
      const proxies=[
        ()=>fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`).then(r=>r.json()).then(d=>d.contents||''),
        ()=>fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`).then(r=>r.text()),
        ()=>fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`).then(r=>r.text()),
      ];
      for(const proxy of proxies){
        try{
          const raw=await Promise.race([proxy(), new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),8000))]);
          if(raw&&raw.length>200){text=raw;break;}
        }catch(e){}
      }
      btn.innerHTML='<span class="spinner"></span>Parsing…';
      // If page text is too thin (JS-rendered site), fall back to Claude's knowledge
      // Strip CSS, scripts, and HTML tags before extracting text — gets real content not boilerplate
      const noScripts=text.replace(/<script[^>]*>[\s\S]*?<\/script>/gi,'').replace(/<style[^>]*>[\s\S]*?<\/style>/gi,'');
      const cleanText=noScripts.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().substring(0,10000);
      dlog('Fetched page text length: '+cleanText.length+' chars', {preview:cleanText.substring(0,200)});
      const prompt = cleanText.length > 300
        ? `URL:${url}\nPage text:\n${cleanText}`
        : `The page at this URL requires JavaScript to render so I could not fetch its content. Please use your knowledge of this recipe URL to fill in all details:\nURL: ${url}`;
      dlog('Using '+(cleanText.length>300?'fetched text':'Claude knowledge fallback'));
      const raw=await apiPost({system:SYS,messages:[{role:'user',content:prompt}]});
      dlog('AI raw response', {raw:raw.substring(0,800)});
      const parsed=parseJSON(raw);
      dlog('Parsed ingredients: '+( parsed.ingredients||[]).length+' items', {names:(parsed.ingredients||[]).map(i=>i.name)});
      const meta=collectMeta(parsed);
      persistRecipe({...parsed,...meta,source:url,id:Date.now()+Math.floor(Math.random()*1000)});
      closeSheet();toast('Recipe added!');
    }catch(e){
      if(e.message==='NO_API_KEY')showError('Add your API key in Settings first.');
      else{showError('Error: '+e.message);btn.textContent='Add recipe';btn.disabled=false;}
    }
    return;
  }

  if(addMethod==='photo'){
    if(!pendingPhotos.length){showError('Please choose at least one photo first.');return;}
    btn.innerHTML='<span class="spinner"></span>Reading image…';btn.disabled=true;
    try{
      const content=pendingPhotos.map(p=>({type:'image',source:{type:'base64',media_type:p.mimeType,data:p.dataUrl.split(',')[1]}}));
      content.push({type:'text',text:'Parse this recipe.'});
      const raw=await apiPost({system:SYS,messages:[{role:'user',content}]});
      const parsed=parseJSON(raw);
      const meta=collectMeta(parsed);
      const sourceImages=pendingPhotos.map(p=>p.dataUrl);
      persistRecipe({...parsed,...meta,sourceImages,id:Date.now()+Math.floor(Math.random()*1000)});
      closeSheet();toast('Recipe added!');
    }catch(e){
      showError('Error: '+e.message);
      btn.textContent='Add recipe';btn.disabled=false;
    }
  }
}

// Adds a parsed/manual recipe to state. Warns (via confirm) if a recipe with the same
// source URL or name already exists, since AI imports can easily be triggered twice.
function persistRecipe(r, skipDupeCheck=false){
  // images are saved to IDB after state update
  if(!skipDupeCheck){
    // Check for duplicate by URL
    if(r.source&&r.source.startsWith('http')){
      const dupe=state.recipes.find(x=>x.source&&x.source===r.source);
      if(dupe){
        if(!confirm(`You already have "${dupe.name}" from that URL. Add it again anyway?`)) return;
      }
    }
    // Check for duplicate by name
    const nameDupe=state.recipes.find(x=>x.name&&r.name&&x.name.toLowerCase()===r.name.toLowerCase());
    if(nameDupe){
      if(!confirm(`You already have a recipe called "${nameDupe.name}". Add it again anyway?`)) return;
    }
  }
  state.recipes.unshift(r);
  saveState();
  // Back up source photos to GitHub asynchronously, then persist their backup URLs
  if(r.sourceImages&&r.sourceImages.length){
    uploadRecipeImages(r).then(changed=>{if(changed){saveState();render();}});
  }
  render();
}

function formatLastMade(ts){
  if(!ts)return null;
  const d=Math.floor((Date.now()-ts)/(864e5));
  if(d===0)return'Made today';if(d===1)return'Made yesterday';
  if(d<7)return`Made ${d}d ago`;if(d<14)return'Made last week';
  const mo=Math.floor(d/30);
  if(mo===0)return`Made ${Math.floor(d/7)}w ago`;if(mo===1)return'Made last month';
  return`Made ${mo}mo ago`;
}

function getCategoryIndex(ingName){
  const lower=ingName.toLowerCase();
  for(let i=0;i<SHOP_CATEGORIES.length;i++){
    if(SHOP_CATEGORIES[i].keywords.some(k=>lower.includes(k))) return i;
  }
  return SHOP_CATEGORIES.length; // uncategorized goes last
}

function buildShoppingList(){
  const planned=state.recipes.filter(r=>state.planned.includes(r.id));
  if(!planned.length)return null;
  const combined={},perRecipe={};
  for(const r of planned){
    const m=recipeMultipliers[r.id]||1;
    perRecipe[r.id]={name:r.name,emoji:r.emoji,items:[],id:r.id};
    for(const ing of(r.ingredients||[])){
      const key='ing_'+ing.name.toLowerCase().replace(/[^a-z0-9]/g,'');
      const amt=buildDisplayAmt(ing,m)||'';
      const dname=ing.notes?`${ing.name} (${ing.notes})`:ing.name;
      const catIdx=getCategoryIndex(ing.name);
      perRecipe[r.id].items.push({key,name:dname,amount:amt,catIdx});
      if(!combined[key])combined[key]={name:dname,amounts:[],catIdx,key};
      if(amt)combined[key].amounts.push(amt);
    }
  }
  // Sort combined list by category then name
  const combinedList=Object.values(combined)
    .sort((a,b)=>a.catIdx!==b.catIdx?a.catIdx-b.catIdx:a.name.localeCompare(b.name))
    .map(c=>({name:c.name,amount:c.amounts.join(' + ')||'',key:c.key,catIdx:c.catIdx}));
  // Sort per-recipe items too
  for(const rid of Object.keys(perRecipe)){
    perRecipe[rid].items.sort((a,b)=>a.catIdx!==b.catIdx?a.catIdx-b.catIdx:a.name.localeCompare(b.name));
  }
  return{combinedList,perRecipe};
}

function renderRecipeCard(r){
    const isPlanned=state.planned.includes(r.id);
    const isExpanded=expandedRecipe===r.id;
    const mult=recipeMultipliers[r.id]||1;
    const lm=formatLastMade(r.lastMade);
    const hasImages=r.sourceImages&&r.sourceImages.length;
    const thumbSrc=hasImages?r.sourceImages[0]:null;
    const ingCount=(r.ingredients||[]).length;

    let html=`<div class="recipe-card">
      <div class="card-top">
        <div class="card-thumb">
          ${thumbSrc
            ?`<img src="${escHtml(thumbSrc)}" alt="recipe">
               <button class="card-thumb-btn" onclick="event.stopPropagation();openLightboxFromRecipe(${r.id},0)" aria-label="View image">
                 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
               </button>`
            :(r.emoji||'🍽️')}
        </div>
        <div class="card-body" onclick="toggleExpand(${r.id})">
          <div class="card-title">${escHtml(r.name||'Untitled')}</div>
          <div class="card-chips">
            ${(r.tags||[]).slice(0,3).map(t=>`<span class="chip chip-tag">${escHtml(t)}</span>`).join('')}
            ${r.time?`<span class="chip chip-time">⏱ ${escHtml(r.time)}</span>`:''}
            ${r.difficulty?`<span class="chip chip-diff ${r.difficulty}">${r.difficulty}</span>`:''}
          </div>
          <div class="card-meta">
            ${r.servings?`<span>${mult!==1?Math.round(r.servings*mult*2)/2:r.servings} srv</span>`:''}
            ${ingCount?`<span>${ingCount} ing.</span>`:''}
            ${lm?`<span class="last-made-dot"></span><span>${escHtml(lm)}</span>`:''}
          </div>
        </div>
        <div class="card-actions" onclick="event.stopPropagation()">
          <button class="plan-btn ${isPlanned?'planned':''}" onclick="togglePlan(${r.id})">${isPlanned?'✓':'+ Plan'}</button>
          <button class="icon-btn" onclick="openEditSheet(${r.id})" aria-label="Edit" title="Edit">✎</button>
          <button class="icon-btn danger" onclick="deleteRecipe(${r.id})" aria-label="Delete">✕</button>
        </div>
      </div>`;

    if(isExpanded){
      html+=`<div class="card-detail">`;

      // Notes
      html+=`<div class="notes-area" id="notes-area-${r.id}">
        <div class="notes-label">Notes</div>
        ${r.notes
          ?`<div class="notes-text">${escHtml(r.notes)}</div>
             <button class="notes-btn" onclick="event.stopPropagation();startNoteEdit(${r.id})">Edit note</button>`
          :`<button class="notes-btn" onclick="event.stopPropagation();startNoteEdit(${r.id})">+ Add a note</button>`}
      </div>`;

      // Multiplier + ingredients
      if(ingCount){
        html+=`<div class="multiplier-row">
          <span class="multiplier-label">Servings${r.servings?` (base ${r.servings})`:''}:</span>
          <div class="mult-btns">
            ${[{v:0.5,l:'½×'},{v:1,l:'1×'},{v:2,l:'2×'},{v:3,l:'3×'}].map(({v,l})=>`<button class="mult-btn ${mult===v?'active':''}" onclick="event.stopPropagation();setMultiplier(${r.id},${v})">${l}</button>`).join('')}
          </div>
        </div>
        <div class="ing-grid">`;
        for(const ing of r.ingredients){
          const da=buildDisplayAmt(ing, mult);
          html+=`<div class="ing-row">
            <span class="ing-name">${escHtml(ing.name)}${ing.notes?` <span class="ing-note">(${escHtml(ing.notes)})</span>`:''}</span>
            <span class="ing-amount">${escHtml(da)}</span>
          </div>`;
        }
        html+=`</div>`;
      }

      // Source images
      if(hasImages){
        html+=`<div class="source-images">`;
        r.sourceImages.forEach((src,i)=>{
          html+=`<div class="source-img-wrap">
            <img class="source-img-thumb" src="${escHtml(src)}" alt="Page ${i+1}" onclick="openLightboxFromRecipe(${r.id},${i})" loading="lazy">
            <button class="source-img-del" onclick="event.stopPropagation();deleteSourceImage(${r.id},${i})" aria-label="Remove photo">✕</button>
          </div>`;
        });
        html+=`</div>`;
      }

      // Web link
      if(r.source&&r.source.startsWith('http')){
        html+=`<a class="source-link" href="${escHtml(r.source)}" target="_blank">View original recipe →</a>`;
      }

      html+=`</div>`; // card-detail
    }
    html+=`</div>`; // recipe-card
    return html;
}

function shopItemHtml(key,name,amount){
  const have=!!state.haveItems[key],bought=!!state.checkedItems[key];
  return`<div class="shop-item ${have?'have':''} ${bought?'bought':''}">
    <div class="shop-have-zone" onclick="toggleHave('${escHtml(key)}')"><div class="have-icon"><div class="have-line"></div></div></div>
    <div class="shop-item-body" onclick="toggleBought('${escHtml(key)}')">
      <div class="shop-item-name">${escHtml(name)}</div>
      ${amount?`<div class="shop-item-amount">${escHtml(amount)}</div>`:''}
    </div>
    <div class="shop-buy-zone" onclick="toggleBought('${escHtml(key)}')">
      <div class="buy-check"><svg class="check-mark" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,6 5,9 10,3"/></svg></div>

function toggleBought(k){state.checkedItems[k]=!state.checkedItems[k];if(state.checkedItems[k])state.haveItems[k]=false;saveState();renderShopping();}
function clearAllMarks(){state.checkedItems={};state.haveItems={};saveState();renderShopping();}

function getStorageUsedKB(){
  let total=0;
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);total+=(localStorage.getItem(k)||'').length;}}catch(e){}
  return Math.round(total/1024);
}

  const el=document.getElementById('storage-usage-display');
  if(!el)return;
  const usedKB=getStorageUsedKB();
  el.innerHTML=`Recipe data: <span style="color:var(--green);font-weight:500">${usedKB}KB</span> (localStorage) · Images: stored in IndexedDB <span style="color:var(--green);font-weight:500">(no size limit)</span>`;
}

function exportData(){
  const now=new Date();
  const date=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const blob=new Blob([JSON.stringify({recipes:state.recipes},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`dinner-backup-${date}.json`;a.click();
}
function importData(){document.getElementById('import-file').click();}
function handleImport(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.recipes||!Array.isArray(data.recipes)) throw new Error();
      // Skip duplicates by ID and name
      const existingIds=new Set(state.recipes.map(r=>r.id));
      const existingNames=new Set(state.recipes.map(r=>(r.name||'').toLowerCase()));
      const toAdd=data.recipes.filter(r=>!existingIds.has(r.id)&&!existingNames.has((r.name||'').toLowerCase()));
      const skipped=data.recipes.length-toAdd.length;
      if(!toAdd.length){toast('No new recipes to import — all already exist.');return;}
      state.recipes.push(...toAdd);
      saveState();render();
      let msg=`Imported ${toAdd.length} recipe${toAdd.length!==1?'s':''}`;
      if(skipped) msg+=` (${skipped} duplicate${skipped!==1?'s':''} skipped)`;
      msg+='. Note: photos are not included in backups.';
      toast(msg, 5000);
    }catch{toast('Could not read that file — is it a valid backup?');}
  };
  reader.readAsText(file);
}

  const content=document.getElementById('debug-log-content');
  if(!debugLog.length){
    content.innerHTML='<div style="color:var(--text3);font-size:13px;text-align:center;padding:20px">No imports logged yet.<br>Add a recipe to see the log.</div>';
  } else {
    content.innerHTML=debugLog.map(e=>`
      <div style="border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px">
          <div style="font-size:13px;font-weight:500;color:var(--text)">${escHtml(e.msg)}</div>
          <div style="font-size:11px;color:var(--text3);flex-shrink:0;margin-left:8px">${e.time}</div>
        </div>
        ${e.data?`<div style="font-size:11px;color:var(--text2);font-family:monospace;word-break:break-all;white-space:pre-wrap;background:var(--bg2);border-radius:6px;padding:6px 8px;margin-top:4px">${escHtml(e.data)}</div>`:''}
      </div>`).join('');
  }
  document.getElementById('debug-overlay').style.opacity='1';
  document.getElementById('debug-overlay').style.pointerEvents='auto';
  document.getElementById('debug-modal').style.transform='translateX(-50%) translateY(0)';
}
function closeDebugLog(){
  document.getElementById('debug-overlay').style.opacity='0';
  document.getElementById('debug-overlay').style.pointerEvents='none';
  document.getElementById('debug-modal').style.transform='translateX(-50%) translateY(100%)';
}

function render(){
  if(currentTab==='recipes')renderRecipes();
  else if(currentTab==='shopping')renderShopping();
  else{renderSettings();setTimeout(showStorageUsage,50);}
}
function escHtml(s){
  if(!s)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadState().then(()=>{
  render();
  if(pendingCloudBackup) showWelcomeModal();
});

// Auto-update check: re-fetches this same page from GitHub Pages (cache-busted) and
// compares its VERSION constant to ours. If newer, shows a banner with a reload button.
// This is why VERSION must be bumped on every deploy.
async function checkForUpdate(){
  try{
    const res=await fetch(window.location.href+'?cachebust='+Date.now(),{cache:'no-store'});
    const html=await res.text();
    const match=html.match(/const VERSION='([^']+)'/);
    if(match&&match[1]&&match[1]!==VERSION){
      showUpdateBanner(match[1]);
    }
  }catch(e){}
}

function showUpdateBanner(newVersion){
  const banner=document.createElement('div');
  banner.id='update-banner';
  banner.style.cssText='position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--accent);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:999;font-size:13px;font-weight:500';
  banner.innerHTML=`<span>v${newVersion} available</span><button onclick="window.location.reload(true)" style="background:rgba(255,255,255,0.25);border:none;color:#fff;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif">Update now</button>`;
  document.body.appendChild(banner);
}

// Check for update 3 seconds after load
setTimeout(checkForUpdate, 3000);

// Register the service worker for offline support. Scoped to ./ (the
// dinner-planner/ path on GitHub Pages) so it only controls this app.
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(e=>dlog('Service worker registration failed: '+e.message));
  });
}
</script>
</body>
